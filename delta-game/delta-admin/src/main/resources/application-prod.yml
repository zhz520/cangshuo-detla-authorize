server:
  port: ${SERVER_PORT:17422}
  forward-headers-strategy: native

spring:
  application:
    name: client742-game
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:17423/client742_game?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:client742}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:17424}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:7}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aes:
  key: ${AES_KEY}

jwt:
  secret: ${JWT_SECRET}
  expiration: 259200000

auth:
  h5:
    otp-required: true

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:17420,http://127.0.0.1:17421}

wx:
  miniapp:
    enabled: ${WX_MINIAPP_ENABLED:false}
    appid: ${WX_MINIAPP_APPID:}
    secret: ${WX_MINIAPP_SECRET:}
    subscribe-template:
      order-status: ${WX_TEMPLATE_ORDER_STATUS:}
      income: ${WX_TEMPLATE_INCOME:}
      team-invite: ${WX_TEMPLATE_TEAM_INVITE:}
      order-confirm: ${WX_TEMPLATE_ORDER_CONFIRM:}
  pay:
    enabled: ${WX_PAY_ENABLED:false}
    mch-id: ${WX_PAY_MCH_ID:}
    notify-url: ${WX_PAY_NOTIFY_URL:}
    api-v3-key: ${WX_PAY_API_V3_KEY:}
    private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
    cert-serial-no: ${WX_PAY_CERT_SERIAL_NO:}
    public-key-path: ${WX_PAY_PUBLIC_KEY_PATH:}
    public-key-id: ${WX_PAY_PUBLIC_KEY_ID:}
    key-store-path: ${WX_PAY_KEY_STORE_PATH:}

file:
  upload:
    path: ${FILE_UPLOAD_PATH:D:/codeStudy/code/742/runtime/uploads/}
    url-prefix: ${FILE_UPLOAD_URL_PREFIX:/file/}

delta:
  settlement:
    commission-rate: 0.2

logging:
  level:
    com.delta: info
    org.springframework.security: info

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false
    path: /v3/api-docs
  packages-to-scan: com.delta
  paths-to-match: "/**"

knife4j:
  enable: false
  setting:
    language: zh_cn
    swagger-model-name: 实体类
